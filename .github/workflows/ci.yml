name: Unit Tests

on:
  push:
    branches: [ "main", "hash-map" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release, RelWithDebInfo, Debug

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "MSVC Debug"
          os: windows-2022
          build_type: "Debug"
          cxx: "cl"
          generators: "Ninja"
        - name: "MSVC Test"
          os: windows-2022
          build_type: "RelWithDebInfo"
          cxx: "cl"
          generators: "Ninja"
        - name: "MSVC Release"
          os: windows-2022
          build_type: "Release"
          cxx: "cl"
          generators: "Ninja"
        - name: "GCC Debug"
          os: ubuntu-latest
          build_type: "Debug"
          cxx: "g++"
          generators: "Ninja"
        - name: "GCC Test"
          os: ubuntu-latest
          build_type: "RelWithDebInfo"
          cxx: "g++"
          generators: "Ninja"
        - name: "GCC Release"
          os: ubuntu-latest
          build_type: "Release"
          cxx: "g++"
          generators: "Ninja"
        - name: Clang Debug
          os: ubuntu-latest
          build_type: "Debug"
          cxx: "clang++"
          generators: "Ninja"
        - name: Clang Test
          os: ubuntu-latest
          build_type: "RelWithDebInfo"
          cxx: "clang++"
          generators: "Ninja"
        - name: Clang Release
          os: ubuntu-latest
          build_type: "Release"
          cxx: "clang++"
          generators: "Ninja"
    name: ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    steps:
    - uses: actions/checkout@v7

    - name: Set up MSVC developer environment
      # Ninja + cl needs the MSVC toolchain on PATH (the VS generator did this implicitly).
      if: matrix.config.cxx == 'cl'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        # Pin the MSVC toolset so the compiler is version 19.44 (_MSC_VER 1944).
        toolset: "14.44"

    - name: Configure CMake
      # Ninja is single-config, so the build type must be set at configure time via CMAKE_BUILD_TYPE.
      run: cmake -B ${{github.workspace}}/build -G "${{matrix.config.generators}}" -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}} -DOPAL_BUILD_TESTS=ON -DOPAL_HARDENING=OFF

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      run: ctest --output-on-failure

  # Every job above passes OPAL_HARDENING=OFF, so none of them instruments anything. Without this job a use-after-free reaches
  # main green. ASan and UBSan are what OPAL_HARDENING=ON turns on for GCC and Clang.
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "GCC sanitizers"
          cxx: "g++"
        - name: "Clang sanitizers"
          cxx: "clang++"
    name: ${{matrix.config.name}}
    runs-on: ubuntu-latest
    env:
      # UBSan only prints and keeps going by default, which would let a finding pass as a green run. ASan aborts on its own.
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
    - uses: actions/checkout@v7

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}} -DOPAL_BUILD_TESTS=ON -DOPAL_HARDENING=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure

  # OPAL_EXCEPTIONS=OFF turns every throw into a call to the contract violation handler, which is a different compile of every
  # header. Nothing in the job above covers it, so a new throw would break that build without anyone noticing until they tried
  # it. There is no test step: the option forces OPAL_BUILD_TESTS off, since Catch2 needs exceptions.
  no-exceptions:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "MSVC no exceptions"
          os: windows-2022
          cxx: "cl"
        - name: "GCC no exceptions"
          os: ubuntu-latest
          cxx: "g++"
        - name: "Clang no exceptions"
          os: ubuntu-latest
          cxx: "clang++"
    name: ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    steps:
    - uses: actions/checkout@v7

    - name: Set up MSVC developer environment
      if: matrix.config.cxx == 'cl'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: "14.44"

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}} -DOPAL_HARDENING=OFF -DOPAL_EXCEPTIONS=OFF

    - name: Build the library
      run: cmake --build ${{github.workspace}}/build --target opal

  # Google Benchmark only enters the build behind OPAL_BUILD_BENCHMARKS, which every job above leaves off. This job keeps the
  # fetch and the benchmark sources compiling and runs the smallest size of every benchmark once, so a crash shows up here
  # rather than at the start of a measurement session. The timings it prints mean nothing on a shared runner.
  benchmarks:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "MSVC benchmarks"
          os: windows-2022
          cxx: "cl"
        - name: "GCC benchmarks"
          os: ubuntu-latest
          cxx: "g++"
        - name: "Clang benchmarks"
          os: ubuntu-latest
          cxx: "clang++"
    name: ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    steps:
    - uses: actions/checkout@v7

    - name: Set up MSVC developer environment
      if: matrix.config.cxx == 'cl'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: "14.44"

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}} -DOPAL_BUILD_TESTS=OFF -DOPAL_HARDENING=OFF -DOPAL_BUILD_BENCHMARKS=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    - name: Smoke run
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ./opal_benchmark --benchmark_filter=1024 --benchmark_min_time=1x
